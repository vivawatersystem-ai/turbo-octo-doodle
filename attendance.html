<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>تسجيل الحضور والانصراف - فيفا ووتر سيستم</title>
<style>
  :root {
    --ink: #16261f;
    --paper: #f6f5f0;
    --card: #ffffff;
    --line: #dedad0;
    --teal: #1f6f5c;
    --teal-dark: #14503f;
    --amber: #c2782e;
    --danger: #a4372c;
    --muted: #6b7268;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", Tahoma, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px 48px;
    min-height: 100vh;
  }
  .brand {
    text-align: center;
    margin-bottom: 22px;
  }
  .brand .drop {
    width: 40px;
    height: 40px;
    margin: 0 auto 10px;
    border-radius: 60% 60% 60% 0;
    background: var(--teal);
    transform: rotate(45deg);
  }
  .brand h1 {
    font-size: 19px;
    margin: 0;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .brand p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  .clock {
    text-align: center;
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 22px;
    font-variant-numeric: tabular-nums;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 20px;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--ink);
  }
  select, input[type=text] {
    width: 100%;
    padding: 13px 14px;
    font-size: 16px;
    border: 1.5px solid var(--line);
    border-radius: 9px;
    background: #fff;
    color: var(--ink);
    margin-bottom: 18px;
    font-family: inherit;
  }
  select:focus, input:focus {
    outline: none;
    border-color: var(--teal);
  }
  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 4px;
  }
  button {
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    padding: 16px 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  button:active {
    transform: scale(0.97);
  }
  button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  #btnIn {
    background: var(--teal);
    color: #fff;
  }
  #btnOut {
    background: var(--ink);
    color: #fff;
  }
  .status {
    margin-top: 18px;
    padding: 14px 15px;
    border-radius: 10px;
    font-size: 14.5px;
    line-height: 1.6;
    display: none;
  }
  .status.show { display: block; }
  .status.ok { background: #e8f3ee; color: var(--teal-dark); border: 1px solid #bfe0d3; }
  .status.warn { background: #fbf1e4; color: var(--amber); border: 1px solid #f0d7ac; }
  .status.err { background: #fbeae7; color: var(--danger); border: 1px solid #f0c4bc; }
  .status.loading { background: #eef0ec; color: var(--muted); border: 1px solid var(--line); }
  .hint {
    text-align: center;
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 16px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="drop"></div>
    <h1>فيفا ووتر سيستم</h1>
    <p>تسجيل الحضور والانصراف</p>
  </div>

  <div class="clock" id="clock">—</div>

  <div class="card">
    <label for="empSelect">اختر اسمك</label>
    <select id="empSelect">
      <option value="">-- اختر الموظف --</option>
      <option value="EMP01">يوسف حمدي</option>
      <option value="EMP02">عمرو محمد</option>
      <option value="EMP03">محمد الطباخ</option>
      <option value="EMP04">خالد الطباخ</option>
      <option value="EMP05">سندس</option>
      <option value="EMP06">رودينا</option>
      <option value="EMP07">فاطمة</option>
      <option value="EMP08">جنة</option>
      <option value="EMP09">احمد سلام</option>
      <option value="EMP10">حسام كمال</option>
      <option value="EMP11">عبدالسلام</option>
      <option value="EMP12">احمد مجدي</option>
    </select>

    <label for="empCode">كود الموظف</label>
    <input type="text" id="empCode" inputmode="numeric" placeholder="مثال: EMP01" autocomplete="off">

    <div class="btn-row">
      <button id="btnIn">تسجيل حضور</button>
      <button id="btnOut">تسجيل انصراف</button>
    </div>

    <div class="status" id="status"></div>
  </div>

  <p class="hint">لازم تكون داخل مقر الشركة وواصل بالإنترنت عشان يتم تأكيد الموقع تلقائياً.</p>
</div>

<script>
  // ==== إعدادات ====
  var WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx8SnNICrAjBmrKkfSk2WdG-0_-TcuislNmrC2_xAddjxxJdQKxWwDYcQj004Zzwsswkg/exec";

  var clockEl = document.getElementById('clock');
  var selectEl = document.getElementById('empSelect');
  var codeEl = document.getElementById('empCode');
  var statusEl = document.getElementById('status');
  var btnIn = document.getElementById('btnIn');
  var btnOut = document.getElementById('btnOut');

  function tick() {
    var now = new Date();
    var opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
    clockEl.textContent = now.toLocaleString('ar-EG', opts);
  }
  tick();
  setInterval(tick, 1000);

  // اختيار الموظف من القائمة يملأ الكود تلقائياً
  selectEl.addEventListener('change', function () {
    codeEl.value = selectEl.value;
  });

  // ==== معرف الجهاز (يتخزن مرة واحدة في المتصفح) ====
  function getDeviceId() {
    var key = 'attendance_device_id';
    var id = '';
    try {
      id = localStorage.getItem(key) || '';
    } catch (e) {
      id = '';
    }
    if (!id) {
      try {
        id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : '';
      } catch (e) {
        id = '';
      }
      if (!id) {
        id = 'dev-' + Date.now() + '-' + Math.random().toString(36).slice(2) + '-' + Math.random().toString(36).slice(2);
      }
      try {
        localStorage.setItem(key, id);
      } catch (e) {
        // لو التخزين فشل، هنستخدم نفس المعرف طول ما الصفحة مفتوحة بس
      }
    }
    return id;
  }
  var deviceId = getDeviceId();

  function setStatus(type, message) {
    statusEl.className = 'status show ' + type;
    statusEl.textContent = message;
  }

  function clearStatus() {
    statusEl.className = 'status';
    statusEl.textContent = '';
  }

  function setButtonsDisabled(disabled) {
    btnIn.disabled = disabled;
    btnOut.disabled = disabled;
  }

  function submitAttendance(type) {
    var code = codeEl.value.trim().toUpperCase();

    if (!code) {
      setStatus('err', 'من فضلك اختر اسمك أو اكتب كودك أولاً.');
      return;
    }

    if (!navigator.geolocation) {
      setStatus('err', 'المتصفح ده مش بيدعم تحديد الموقع. جرب متصفح تاني.');
      return;
    }

    setButtonsDisabled(true);
    setStatus('loading', 'جاري تحديد موقعك...');

    navigator.geolocation.getCurrentPosition(
      function (pos) {
        var lat = pos.coords.latitude;
        var lng = pos.coords.longitude;
        sendToSheet(code, type, lat, lng);
      },
      function (err) {
        setButtonsDisabled(false);
        setStatus('err', 'محتاجين إذن الوصول للموقع عشان نسجل حضورك. من فضلك فعّل خدمة الموقع وحاول تاني.');
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  }

  function sendToSheet(code, type, lat, lng) {
    if (!deviceId) {
      deviceId = getDeviceId();
    }
    setStatus('loading', 'جاري إرسال التسجيل...');

    fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ code: code, type: type, lat: lat, lng: lng, deviceId: deviceId })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        setButtonsDisabled(false);
        if (data.status === 'success') {
          setStatus('ok', data.message);
        } else if (data.status === 'warning') {
          setStatus('warn', data.message);
        } else {
          setStatus('err', data.message || 'حصل خطأ، حاول تاني.');
        }
      })
      .catch(function (e) {
        setButtonsDisabled(false);
        setStatus('err', 'تعذر الاتصال بالسيرفر. تأكد من اتصال الإنترنت وحاول تاني.');
      });
  }

  btnIn.addEventListener('click', function () { submitAttendance('حضور'); });
  btnOut.addEventListener('click', function () { submitAttendance('انصراف'); });
</script>
</body>
</html>
